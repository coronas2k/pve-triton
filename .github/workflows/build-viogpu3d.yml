name: Build viogpu3d (neptune HEAD, x64)

on:
  push:
    branches: ['**']
    paths: ['.github/workflows/build-viogpu3d.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # WDK 10.0.26100 (bin+lib) and VS2026 Enterprise are preinstalled on this image
    runs-on: windows-2025-vs2026
    steps:
      - name: Clone upstream driver source
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          git clone --filter=blob:none https://github.com/osy/kvm-guest-drivers-windows.git
          cd kvm-guest-drivers-windows
          git checkout 3f58ca3  # neptune HEAD at build time

      - name: Install WDK (kernel-mode headers, libs, tools)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          if (-not (Test-Path "$kits\Include\10.0.26100.0\km\ntddk.h")) {
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2324617' -OutFile C:\wdksetup.exe
            $p = Start-Process -FilePath C:\wdksetup.exe -ArgumentList '/q','/norestart' -Wait -PassThru
            Write-Host "wdksetup exit code: $($p.ExitCode)"
          }
          $ver = Get-ChildItem "$kits\Include" -Directory |
            Where-Object { Test-Path "$($_.FullName)\km\ntddk.h" } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $ver) { throw 'WDK km headers not found after install' }
          Write-Host "WDK version folder: $($ver.Name)"
          "WINSDK_VER=$($ver.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $lib = Get-ChildItem "$kits\Lib\$($ver.Name)\km\x64" -Filter ntoskrnl.lib
          if (-not $lib) { throw 'WDK kernel libs not found after install' }

      - name: Stage UMD DLLs from v0.3 release
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://github.com/osy/kvm-guest-drivers-windows/releases/download/v0.3/viogpu3d-x64-signed.zip' -OutFile C:\v03.zip
          Expand-Archive -Path C:\v03.zip -DestinationPath C:\v03
          New-Item -ItemType Directory -Force -Path C:\mesa\bin | Out-Null
          Copy-Item C:\v03\drivers\viogpu3d\neptune_umd.dll C:\mesa\bin\
          Copy-Item C:\v03\drivers\viogpu3d\vulkan_virtio.dll C:\mesa\bin\

      - name: Create test-signing certificate
        shell: pwsh
        working-directory: kvm-guest-drivers-windows
        run: |
          $c = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=VirtIOTestCert-CI' -CertStoreLocation Cert:\CurrentUser\My
          $p = ConvertTo-SecureString -String 'ci-build' -Force -AsPlainText
          Export-PfxCertificate -Cert $c -FilePath build\VirtIOTestCert.pfx -Password $p
          Export-Certificate -Cert $c -FilePath ..\ci-testcert.cer

      - name: Build viogpu3d (Win10 + Win11, x64)
        shell: cmd
        working-directory: kvm-guest-drivers-windows
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -no_logo
          rem WDK 26100 replaces the EWDK: provide the DDK-build env vars that
          rem the driver projects reference ($(DDK_INC_PATH), $(DDK_LIB_PATH), ...)
          set KITS=C:\Program Files (x86)\Windows Kits\10
          set DDK_INC_PATH=%KITS%\Include\%WINSDK_VER%\km\
          set SDK_INC_PATH=%KITS%\Include\%WINSDK_VER%\shared\
          set DDK_LIB_PATH=%KITS%\Lib\%WINSDK_VER%\km\x64\
          set SDK_LIB_PATH=%KITS%\Lib\%WINSDK_VER%\um\x64\
          set KernelBufferOverflowLib=%DDK_LIB_PATH%BufferOverflowFastFailK.lib
          set PATH=%KITS%\bin\%WINSDK_VER%\x64;%PATH%
          set VIRTIO_WIN_NO_ARM=1
          set MESA_PREFIX=C:\mesa
          cd viogpu
          call ..\build\build.bat viogpu.sln "Win10" x64 || exit /b 1
          call ..\build\build.bat viogpu.sln "Win11" x64 || exit /b 1

      - name: Sign packages
        shell: pwsh
        working-directory: kvm-guest-drivers-windows
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object FullName -match 'x64' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found in WDK bin' }
          Write-Host "signtool: $signtool"
          Get-ChildItem viogpu\Install -Recurse -Include *.cat,*.sys | ForEach-Object {
            & $signtool sign /fd SHA256 /f build\VirtIOTestCert.pfx $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Collect package listing
        shell: pwsh
        working-directory: kvm-guest-drivers-windows
        run: |
          Get-ChildItem viogpu\Install -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Publish to release
        shell: pwsh
        run: |
          Compress-Archive -Path kvm-guest-drivers-windows\viogpu\Install -DestinationPath viogpu3d-ci-x64.zip
          gh release delete ci-latest --yes --cleanup-tag 2>$null
          gh release create ci-latest ci-testcert.cer viogpu3d-ci-x64.zip `
            --title "viogpu3d CI build (neptune HEAD)" `
            --notes "Automated CI build of viogpu3d.sys from neptune HEAD (3f58ca3). Test-signed with VirtIOTestCert-CI. Trust in guest: certutil -addstore Root ci-testcert.cer && certutil -addstore TrustedPublisher ci-testcert.cer"
        env:
          GH_TOKEN: ${{ github.token }}
