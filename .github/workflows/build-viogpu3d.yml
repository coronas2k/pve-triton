name: Build viogpu3d (neptune HEAD, x64)

on:
  push:
    branches: ['**']
    paths: ['.github/workflows/build-viogpu3d.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'osy/kvm-guest-drivers-windows commit SHA to build'
        required: false
        default: '3f58ca3'

permissions:
  contents: write

jobs:
  build:
    # Parallels Windows ARM64 VM with EWDK 24H2 ISO at C:\Users\nayef\ewdk24h2.iso
    runs-on: [self-hosted, Windows, ARM64]
    steps:
      - name: Fetch upstream driver source
        shell: cmd
        env:
          BUILD_REF: ${{ github.event.inputs.ref || '3f58ca3' }}
        run: |
          if exist %RUNNER_TEMP%\src rmdir /s /q %RUNNER_TEMP%\src
          if exist %RUNNER_TEMP%\v03 rmdir /s /q %RUNNER_TEMP%\v03
          if exist %RUNNER_TEMP%\mesa rmdir /s /q %RUNNER_TEMP%\mesa
          curl.exe -sL -o %RUNNER_TEMP%\drv.zip https://codeload.github.com/osy/kvm-guest-drivers-windows/zip/%BUILD_REF%
          curl.exe -sL -o %RUNNER_TEMP%\v03.zip https://github.com/osy/kvm-guest-drivers-windows/releases/download/v0.3/viogpu3d-x64-signed.zip
          powershell -NoProfile -Command "Expand-Archive %RUNNER_TEMP%\drv.zip -DestinationPath %RUNNER_TEMP%\src -Force; Expand-Archive %RUNNER_TEMP%\v03.zip -DestinationPath %RUNNER_TEMP%\v03 -Force"
          for /d %%d in (%RUNNER_TEMP%\src\kvm-guest-drivers-windows-*) do ren "%%d" drv

      - name: Detect EWDK drive
        shell: powershell
        run: |
          # ISO is kept mounted on this VM; find the drive without touching
          # DiskImage WMI (runner service is NETWORK SERVICE, no admin)
          $letter = 68..90 | ForEach-Object { [char]$_ } | Where-Object {
            Test-Path "$($_):\BuildEnv\SetupBuildEnv.cmd"
          } | Select-Object -First 1
          if (-not $letter) {
            $img = Mount-DiskImage -ImagePath 'C:\Users\nayef\ewdk24h2.iso' -PassThru -ErrorAction Stop
            $letter = ($img | Get-Volume).DriveLetter
          }
          Write-Host "EWDK at ${letter}:\"
          "EWDK_DRIVE=${letter}:\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build viogpu3d (Win10 + Win11, x64)
        shell: cmd
        env:
          EWDK11_24H2_DIR: ${{ env.EWDK_DRIVE }}
          EWDK11_DIR: ${{ env.EWDK_DRIVE }}
          MESA_PREFIX: ${{ runner.temp }}\mesa
          VIRTIO_WIN_NO_ARM: 1
        run: |
          if not exist %RUNNER_TEMP%\mesa\bin mkdir %RUNNER_TEMP%\mesa\bin
          if not exist %RUNNER_TEMP%\mesa\share\vulkan\icd.d mkdir %RUNNER_TEMP%\mesa\share\vulkan\icd.d
          copy /y %RUNNER_TEMP%\v03\drivers\viogpu3d\neptune_umd.dll %RUNNER_TEMP%\mesa\bin\
          copy /y %RUNNER_TEMP%\v03\drivers\viogpu3d\vulkan_virtio.dll %RUNNER_TEMP%\mesa\bin\
          copy /y %RUNNER_TEMP%\v03\drivers\viogpu3d\vulkan_virtio.dll %RUNNER_TEMP%\mesa\share\vulkan\icd.d\
          copy /y %RUNNER_TEMP%\v03\drivers\viogpu3d\virtio_icd.json %RUNNER_TEMP%\mesa\share\vulkan\icd.d\
          cd /d %RUNNER_TEMP%\src\drv\viogpu
          call ..\build\build.bat viogpu.sln "Win10" x64
          call ..\build\build.bat viogpu.sln "Win11" x64
          if not exist Install\Win10\amd64\viogpu3d.sys exit /b 1
          if not exist Install\Win11\amd64\viogpu3d.sys exit /b 1

      - name: Create test-signing certificate
        shell: powershell
        working-directory: ${{ runner.temp }}/src/drv
        run: |
          $c = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=VirtIOTestCert-CI' -CertStoreLocation Cert:\CurrentUser\My
          $p = ConvertTo-SecureString -String 'ci-build' -Force -AsPlainText
          Export-PfxCertificate -Cert $c -FilePath build\VirtIOTestCert.pfx -Password $p
          Export-Certificate -Cert $c -FilePath ..\ci-testcert.cer

      - name: Sign packages
        shell: powershell
        working-directory: ${{ runner.temp }}/src/drv
        run: |
          $signtool = @("$env:EWDK_DRIVE\Program Files\Windows Kits\10\bin", 'C:\Program Files (x86)\Windows Kits\10\bin') | ForEach-Object {
            Get-ChildItem $_ -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
          } | Where-Object FullName -match 'x64' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          Write-Host "signtool: $signtool"
          Get-ChildItem viogpu\Install -Recurse -Include *.cat,*.sys | ForEach-Object {
            & $signtool sign /fd SHA256 /f build\VirtIOTestCert.pfx /p ci-build $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Collect package listing
        shell: powershell
        working-directory: ${{ runner.temp }}/src/drv
        run: |
          Get-ChildItem viogpu\Install -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Publish to release
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $env:PATH = "C:\tools\bin;$env:PATH"  # gh.exe staged on the VM
          Compress-Archive -Path src\drv\viogpu\Install -DestinationPath viogpu3d-ci-x64.zip
          # PS 5.1 + $ErrorActionPreference=stop turns any redirected native stderr
          # into a terminating error, so do the best-effort delete via cmd instead
          cmd /c "gh release delete ci-latest --yes --cleanup-tag -R coronas2k/pve-triton 2>nul & exit /b 0"
          gh release create ci-latest -R coronas2k/pve-triton src\ci-testcert.cer viogpu3d-ci-x64.zip `
            --title "viogpu3d CI build (neptune @ ${{ github.event.inputs.ref || '3f58ca3' }})" `
            --notes "Automated CI build of viogpu3d.sys from osy/kvm-guest-drivers-windows ${{ github.event.inputs.ref || '3f58ca3' }}. Test-signed with VirtIOTestCert-CI. Trust in guest: certutil -addstore Root ci-testcert.cer && certutil -addstore TrustedPublisher ci-testcert.cer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ github.token }}
